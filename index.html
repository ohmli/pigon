<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Recognition</title>
<style>
  :root{--bg:#eef1ec;--ink:#1b2a22;--mute:#5d6b63;--panel:#fff;--line:#cfd8d1;--accent:#1f6f4a;--box:#ff4f2e}
  @media (prefers-color-scheme:dark){:root{--bg:#121a16;--ink:#e6efe9;--mute:#93a39a;--panel:#1a251f;--line:#2c3b33;--accent:#4fd18f;--box:#ff7a5c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
  main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.01em}
  p.sub{margin:0 0 20px;color:var(--mute)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  button,label.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  @media (prefers-color-scheme:dark){button,label.btn{color:#0b1510}}
  button.alt,label.btn{background:transparent;color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible,label.btn:focus-within{outline:3px solid var(--box);outline-offset:2px}
  input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
  #status{color:var(--mute);margin-left:auto}
  .stage{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:240px;display:grid;place-items:center}
  .stage video,.stage img{display:block;max-width:100%;max-height:70vh}
  .stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
  .empty{color:#9fb0a6;padding:48px 16px;text-align:center}
  #list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  #list li{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.95rem}
  #list li b{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Object recognition</h1>
  <p class="sub">Runs entirely in your browser with TensorFlow.js and the COCO-SSD model (80 everyday object types). Nothing is uploaded.</p>

  <div class="bar">
    <button id="camBtn" disabled>Start camera</button>
    <label class="btn">Upload image<input type="file" id="file" accept="image/*"></label>
    <span id="status" role="status">Loading model…</span>
  </div>

  <div class="stage" id="stage">
    <div class="empty" id="empty">Start the camera or upload an image to detect objects.</div>
  </div>
  <ul id="list" aria-live="polite"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const stage = $('stage'), statusEl = $('status'), camBtn = $('camBtn'), list = $('list');
  let model = null, media = null, canvas = null, stream = null, running = false;

  function setStatus(t){ statusEl.textContent = t; }

  cocoSsd.load().then(m => {
    model = m; camBtn.disabled = false; setStatus('Model ready');
  }).catch(e => {
    setStatus('Could not load the model. Check your internet connection and reload.');
    console.error(e);
  });

  function clearStage(){
    running = false;
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    stage.innerHTML = ''; media = canvas = null; list.innerHTML = '';
    camBtn.textContent = 'Start camera';
  }

  function mount(el){
    stage.innerHTML = ''; stage.appendChild(el);
    canvas = document.createElement('canvas'); stage.appendChild(canvas);
    media = el;
  }

  function draw(preds){
    const w = media.clientWidth, h = media.clientHeight;
    const nw = media.videoWidth || media.naturalWidth, nh = media.videoHeight || media.naturalHeight;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    const sx = w / nw, sy = h / nh, ctx = canvas.getContext('2d');
    const box = getComputedStyle(document.documentElement).getPropertyValue('--box').trim();
    ctx.font = '600 14px "Trebuchet MS",Verdana,sans-serif'; ctx.textBaseline = 'top';
    preds.forEach(p => {
      const [x,y,bw,bh] = p.bbox;
      ctx.strokeStyle = box; ctx.lineWidth = 3;
      ctx.strokeRect(x*sx, y*sy, bw*sx, bh*sy);
      const label = p.class + ' ' + Math.round(p.score*100) + '%';
      const tw = ctx.measureText(label).width + 10, ty = Math.max(0, y*sy - 22);
      ctx.fillStyle = box; ctx.fillRect(x*sx, ty, tw, 22);
      ctx.fillStyle = '#fff'; ctx.fillText(label, x*sx + 5, ty + 4);
    });
    list.innerHTML = preds.map(p => '<li><b>' + p.class + '</b> ' + Math.round(p.score*100) + '%</li>').join('');
  }

  async function detectOnce(){
    const preds = await model.detect(media, 20, 0.5);
    draw(preds);
  }

  async function loop(){
    if (!running) return;
    await detectOnce();
    requestAnimationFrame(loop);
  }

  camBtn.addEventListener('click', async () => {
    if (running){ clearStage(); setStatus('Camera stopped'); return; }
    try {
      clearStage();
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const v = document.createElement('video');
      v.srcObject = stream; v.muted = true; v.playsInline = true;
      mount(v); await v.play();
      running = true; camBtn.textContent = 'Stop camera'; setStatus('Detecting live…');
      loop();
    } catch (e) {
      clearStage();
      setStatus('Camera unavailable. Allow access, or open this file over https or localhost.');
    }
  });

  $('file').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f || !model) return;
    clearStage();
    const img = new Image();
    img.onload = async () => {
      mount(img); setStatus('Detecting…');
      await detectOnce();
      setStatus(list.children.length ? 'Done' : 'No objects found');
    };
    img.src = URL.createObjectURL(f);
    e.target.value = '';
  });

  window.addEventListener('resize', () => { if (media && !running && media.complete) detectOnce(); });
})();
</script>
</body>
</html>
